# Runs the Selenium + Cucumber tests on GitHub every time code is pushed
name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

jobs:
  test:
    runs-on: ubuntu-latest   # a fresh Linux machine with Chrome installed
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the tests (Chrome without a window)
        run: mvn -B test -Dheadless=true

      - name: Save the Cucumber HTML report
        if: always()   # keep the report even when a test fails
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html
